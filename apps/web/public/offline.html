<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f3ee;
        color: #221f1a;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 28rem;
        margin: 1rem;
        padding: 1.5rem;
        border: 1px solid #d8d2c4;
        border-radius: 1rem;
        background: #ffffff;
      }
      h1 {
        margin-top: 0;
        font-size: 1.375rem;
      }
      button {
        padding: 0.75rem 1.25rem;
        border: 0;
        border-radius: 0.75rem;
        background: #221f1a;
        color: #ffffff;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>
        No pudimos conectarnos. Tu pedido o tu operación no se enviaron: nada
        se da por hecho hasta que el servidor lo confirma.
      </p>
      <p>Esta página se actualiza sola cuando vuelva la conexión.</p>
      <button id="retry" type="button">Reintentar ahora</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        location.reload();
      });
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
