# pg_hba.conf of the platform database: the rules of the Supabase image plus ONE line that
# lets the backup tools (pg_basebackup) open a replication connection over the local socket.
# Nothing is opened to the network: a replication connection still has to be made from
# inside the container (docker exec) as the database owner.
#
# Rules below this one are the image's own.
local replication supabase_admin  trust
local all  supabase_admin     trust
local all  all                peer map=supabase_map
host  all  all  127.0.0.1/32  trust
host  all  all  ::1/128       trust
host  all  all  10.0.0.0/8  scram-sha-256
host  all  all  172.16.0.0/12  scram-sha-256
host  all  all  192.168.0.0/16  scram-sha-256
host  all  all  0.0.0.0/0     scram-sha-256
host  all  all  ::0/0     scram-sha-256
