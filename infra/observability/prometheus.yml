global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # The three processes of the platform (metrics ports from docs/runbooks/observabilidad.md).
  - job_name: platform
    static_configs:
      - targets: [host.docker.internal:9464]
        labels: { service: api }
      - targets: [host.docker.internal:9465]
        labels: { service: worker }
      - targets: [host.docker.internal:9466]
        labels: { service: web }

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: host
    static_configs:
      - targets: [node-exporter:9100]

  # Seen from outside: is the public address answering, and how long does its certificate last?
  - job_name: probe-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/etc/prometheus/targets/*.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: self
    static_configs:
      - targets: [localhost:9090, alertmanager:9093]
